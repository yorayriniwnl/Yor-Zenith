name: ChatGPT Audit

on:
  push:
    branches:
      - chatgpt/audit-20260917
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: zenith-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: zenith-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Design token contract
        run: npm run design:check
      - name: Production build
        run: npm run build

  optimization-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: zenith-app/requirements.txt
      - name: Install model dependencies
        run: pip install -r zenith-app/requirements.txt
      - name: Compile model
        run: python -m py_compile zenith-app/lp_model.py
